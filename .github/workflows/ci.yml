name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.47.7'
  # Optional: the Firebase dart-define JSON (docs/FIREBASE_SETUP.md). Without
  # it the app builds with remote monitoring switched off.
  FIREBASE_DEFINES_JSON: ${{ secrets.FIREBASE_DEFINES_JSON }}

jobs:
  test:
    name: Analyze, test, build web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: flutter build web --release --no-web-resources-cdn $(.github/scripts/firebase-defines.sh)
      - uses: actions/upload-artifact@v7
        with:
          name: web
          path: build/web

  android:
    name: Build Android APK
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build apk --debug $(.github/scripts/firebase-defines.sh)
      - uses: actions/upload-artifact@v7
        with:
          name: android-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk

  android-release:
    name: Android release (signed AAB + APK)
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name != 'pull_request'
    env:
      KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
    steps:
      - name: Check signing secrets
        id: signing
        run: |
          if [ -n "$KEYSTORE_B64" ]; then echo "enabled=true" >> "$GITHUB_OUTPUT";
          else echo "::notice::ANDROID_KEYSTORE_BASE64 not set; skipping signed release build (see docs/ANDROID_RELEASE.md)"; fi
      - uses: actions/checkout@v7
        if: steps.signing.outputs.enabled == 'true'
      - uses: actions/setup-java@v6
        if: steps.signing.outputs.enabled == 'true'
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        if: steps.signing.outputs.enabled == 'true'
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Build signed AAB and APK
        if: steps.signing.outputs.enabled == 'true'
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          export ANDROID_KEYSTORE_PATH="$RUNNER_TEMP/upload.jks"
          flutter pub get
          DEFINES="$(.github/scripts/firebase-defines.sh)"
          flutter build appbundle --release --build-number=${{ github.run_number }} $DEFINES
          flutter build apk --release --build-number=${{ github.run_number }} $DEFINES
      - uses: actions/upload-artifact@v7
        if: steps.signing.outputs.enabled == 'true'
        with:
          name: android-release
          path: |
            build/app/outputs/bundle/release/app-release.aab
            build/app/outputs/flutter-apk/app-release.apk

  ios:
    name: Build iOS (no codesign)
    runs-on: macos-latest
    needs: test
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build ios --release --no-codesign $(.github/scripts/firebase-defines.sh)

  functions:
    name: Cloud Functions + Firestore rules
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: firebase/functions
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: firebase/functions/package-lock.json
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/cache@v5
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-${{ hashFiles('firebase/functions/package-lock.json') }}
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      # Rules + function integration tests on the Firebase Emulator Suite.
      - run: npm run test:emulator
